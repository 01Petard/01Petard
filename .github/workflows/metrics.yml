# GitHub 个人主页指标自动生成
#
# 生成文件：
# - github-metrics/base.svg                    基础 GitHub 指标
# - github-metrics/isocalendar.fullyear.svg    全年 3D Contribution Calendar
# - github-metrics/activity-graph.svg           Activity Graph
#
# 依赖项目：
# - https://github.com/lowlighter/metrics
# - https://github.com/Ashutosh00710/github-readme-activity-graph

name: GitHub Metrics

on:
  # GitHub Actions cron 使用 UTC；00:00 UTC = 北京时间 08:00。
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    # 生成文件本身的提交无需再次触发工作流，避免无意义的重复运行。
    paths-ignore:
      - "github-metrics/**"

# 防止定时任务、手动运行和 push 同时执行并竞争写入 main。
concurrency:
  group: github-metrics
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # lowlighter/metrics
  # ---------------------------------------------------------------------------
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # METRICS_TOKEN 当前通过 production Environment 提供。
    environment:
      name: production

    permissions:
      contents: write

    steps:
      # 固定到当前已验证的 lowlighter/metrics 提交，避免 @latest 无提示变更行为。
      # 对应当前运行版本 3.34.0；升级时应先手动验证再更新 SHA。
      - name: Base metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: github-metrics/base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: 01Petard
          template: classic
          config_timezone: Asia/Shanghai
          base: "header, activity, community, repositories"

          # Traffic 需要更高的 PAT 权限；当前明确关闭。
          plugin_traffic: no
          plugin_lines: yes
          plugin_introduction: yes

          # 插件异常时直接失败，避免提交残缺 SVG。
          plugins_errors_fatal: yes
          committer_message: "chore: update GitHub metrics [skip ci]"

      - name: Full-year contribution calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          filename: github-metrics/isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: 01Petard
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugins_errors_fatal: yes
          committer_message: "chore: update GitHub metrics [skip ci]"

  # ---------------------------------------------------------------------------
  # Activity Graph
  #
  # 公共 Vercel 服务当前不可依赖，因此固定上游源码版本，在 Runner 内构建并调用。
  # 与 github-metrics 串行执行，避免两个 Job 同时向 main 推送。
  # ---------------------------------------------------------------------------
  activity-graph:
    needs: github-metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: production

    permissions:
      contents: write

    env:
      ACTIVITY_GRAPH_DIR: /tmp/github-readme-activity-graph
      # 固定上游源码版本，避免默认分支变化导致构建结果不可复现。
      ACTIVITY_GRAPH_SHA: 0962e9461de815933d462e8b98c7ce566cada8fb

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Build activity graph service
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ACTIVITY_GRAPH_DIR"
          git init "$ACTIVITY_GRAPH_DIR"
          git -C "$ACTIVITY_GRAPH_DIR" remote add origin \
            https://github.com/Ashutosh00710/github-readme-activity-graph.git
          git -C "$ACTIVITY_GRAPH_DIR" fetch --depth 1 origin "$ACTIVITY_GRAPH_SHA"
          git -C "$ACTIVITY_GRAPH_DIR" checkout --detach FETCH_HEAD

          cd "$ACTIVITY_GRAPH_DIR"
          npm ci
          npm run build

      - name: Generate activity graph
        shell: bash
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/github-metrics"
          cd "$ACTIVITY_GRAPH_DIR"

          PORT=5100 npm start > /tmp/activity-graph.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          # 最多等待 30 秒；进程提前退出时直接打印日志失败。
          for i in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:5100/" > /dev/null; then
              echo "Activity Graph service started."
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Activity Graph service exited unexpectedly."
              cat /tmp/activity-graph.log
              exit 1
            fi

            if [ "$i" -eq 30 ]; then
              echo "Activity Graph service failed to start within 30 seconds."
              cat /tmp/activity-graph.log
              exit 1
            fi

            sleep 1
          done

          temp_file="$(mktemp)"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 1 \
            "http://127.0.0.1:5100/graph?username=01Petard&theme=github-compact" \
            -o "$temp_file"

          # 避免 HTTP 200 但实际返回空内容或错误页面。
          test -s "$temp_file"
          grep -q '<svg' "$temp_file"

          mv "$temp_file" "$GITHUB_WORKSPACE/github-metrics/activity-graph.svg"

      - name: Commit activity graph
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-metrics/activity-graph.svg

          if git diff --cached --quiet; then
            echo "Activity graph has no changes."
            exit 0
          fi

          # 先提交本地生成结果，再同步运行期间可能出现的 main 更新。
          # git pull --rebase 不能在工作区存在未提交修改时执行。
          git commit -m "chore: update activity graph [skip ci]"
          git pull --rebase origin main
          git push origin main
