<g transform="translate(863 179) rotate(-18) scale(1.12)" opacity="1"><g class="float-a"><use href="#blob"/></g></g>
<g transform="translate(793 135) rotate(10) scale(0.42)" opacity="0.83"><g class="float-d"><use href="#shard"/></g></g>
<g transform="translate(152 37) rotate(-10) scale(0.28)" opacity="0.68"><g class="float-b"><use href="#chip"/></g></g>
<circle class="twinkle" cx="279" cy="61" r="2.3" fill="#059FF4" opacity="0.8"/>
<circle class="twinkle-alt" cx="586" cy="91" r="2.5" fill="#059FF4" opacity="0.8"/>
