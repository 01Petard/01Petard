<g transform="translate(235 154) rotate(-11) scale(0.75)" opacity="1"><g class="float-a"><use href="#chip"/></g></g>
<g transform="translate(300 205) rotate(-17) scale(0.95)" opacity="1"><g class="float-d"><use href="#triangle"/></g></g>
<g transform="translate(557 152) rotate(-8) scale(0.61)" opacity="1"><g class="float-b"><use href="#shard"/></g></g>
